<!doctype html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Sign in | MyFlix</title></head>
<body data-page="login"><div class="backdrop"></div><header><a class="logo" href="index.html">MYFLIX</a></header>
<main class="auth-shell"><section class="card"><p class="eyebrow">Welcome back</p><h1>Sign in</h1><p class="muted">Continue watching on your private streaming platform.</p>
<div id="message" class="message" role="status"></div>
<form id="login-form">
<label>Email address<input id="email" type="email" autocomplete="email" required></label>
<label>Password<div class="password"><input id="password" type="password" autocomplete="current-password" minlength="6" required><button id="show-password" type="button">Show</button></div></label>
<div class="row"><label class="check"><input id="remember" type="checkbox">Remember me</label><button id="forgot-password" class="link-button" type="button">Forgot password?</button></div>
<button class="primary" type="submit">Sign in</button></form>
<div class="divider"><span>or</span></div><a class="secondary" href="register.html">Create account</a>
</section></main><script type="module" src="auth.js"></script></body></html>
