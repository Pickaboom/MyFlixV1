<!doctype html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Create account | MyFlix</title></head>
<body data-page="register"><div class="backdrop"></div><header><a class="logo" href="index.html">MYFLIX</a></header>
<main class="auth-shell"><section class="card"><p class="eyebrow">Join MyFlix</p><h1>Create account</h1><p class="muted">Your email must be verified before access is allowed.</p>
<div id="message" class="message" role="status"></div>
<form id="register-form">
<label>Display name<input id="display-name" type="text" autocomplete="name" required></label>
<label>Email address<input id="email" type="email" autocomplete="email" required></label>
<label>Password<input id="password" type="password" autocomplete="new-password" minlength="6" required></label>
<label>Confirm password<input id="confirm-password" type="password" autocomplete="new-password" minlength="6" required></label>
<button class="primary" type="submit">Create account</button></form>
<p class="centre muted">Already registered? <a href="index.html">Sign in</a></p>
</section></main><script type="module" src="auth.js"></script></body></html>
